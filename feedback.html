<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>到訪者反饋｜NMNS30</title>
<link rel="stylesheet" href="shared/style.css">
<style>
  form { display: grid; gap: 12px; max-width: 720px; }
  label { display: grid; gap: 4px; font-weight: 600; }
  label small { font-weight: 400; color: var(--muted); }
  input, select, textarea { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); width: 100%; box-sizing: border-box; }
  textarea { min-height: 150px; resize: vertical; }
  .acts { display: flex; flex-wrap: wrap; gap: 8px; }
  #status { min-height: 1.4em; color: var(--ok); }
  #preview { white-space: pre-wrap; background: var(--panel); border: 1px dashed var(--line); border-radius: 8px; padding: 10px; font-size: .9rem; display: none; }
</style>
</head>
<body>
<header class="top"><div class="in">
  <h1><a href="index.html">NMNS30</a>｜到訪者反饋</h1>
  <span class="sub">你若曾在 1991 年前後玩過電腦益智室的遊戲，歡迎留下記憶</span>
</div></header>
<main>
  <p>本站的規則與畫面是依 1991 年文章中的「教育內容」重新設計，並非原版還原。如果你記得當年某款遊戲的<b>畫面、規則、關卡、音效、操作方式、使用的電腦機種</b>，或手邊有<b>舊資料、照片、書面說明</b>，請在下面留言，我們會據此修改，讓遊戲更接近當年。</p>
  <form id="f">
    <label>相關遊戲
      <select id="game"></select>
    </label>
    <label>資料類型
      <select id="kind">
        <option>規則／玩法</option><option>畫面／角色／配色</option><option>關卡／難度／題目</option>
        <option>音效／音樂</option><option>操作方式（鍵盤、搖桿等）</option><option>電腦機種與環境</option>
        <option>舊資料／文獻／照片線索</option><option>錯誤回報</option><option>其他</option>
      </select>
    </label>
    <label>你所記得的內容 <small>越具體越好；不確定的部分請註明「不確定」</small>
      <textarea id="body" placeholder="例如：貓捉老鼠的畫面是 40 欄文字模式，貓用「C」表示，老鼠用「m」……"></textarea>
    </label>
    <label>記憶的時間與地點 <small>選填，例如「1990 年左右，臺中科博館二樓」</small>
      <input id="when" type="text" maxlength="120">
    </label>
    <label>署名或聯絡方式 <small>選填；若要我們追問細節才需要。內容可能被公開，請勿填私人資料</small>
      <input id="who" type="text" maxlength="120">
    </label>
    <div class="acts">
      <button class="btn" type="submit" id="send">送出</button>
      <button class="btn alt" type="button" id="copy">複製內容</button>
      <button class="btn alt" type="button" id="dl">下載為文字檔</button>
    </div>
    <div id="status" role="status"></div>
    <div id="preview"></div>
  </form>
  <p class="link" id="how"></p>
  <p><a class="btn alt" href="index.html">← 回遊戲選單</a></p>
</main>
<script src="data/games.js"></script>
<script src="data/config.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); }, C = window.NMNS_CONFIG || {};
  var sel = $("game"), q = parseInt(new URLSearchParams(location.search).get("g"), 10);
  var o = document.createElement("option"); o.value = "0"; o.textContent = "整體／不指定"; sel.appendChild(o);
  NMNS_GAMES.forEach(function (g) { var e = document.createElement("option"); e.value = g.n; e.textContent = (g.n < 10 ? "0" : "") + g.n + " " + g.name; sel.appendChild(e); });
  if (q >= 1 && q <= 30) sel.value = String(q);
  var KEY = "nmns30-feedback-draft";
  try { var d = JSON.parse(localStorage.getItem(KEY) || "null"); if (d) { ["kind", "body", "when", "who"].forEach(function (k) { if (d[k]) $(k).value = d[k]; }); if (!(q >= 1 && q <= 30) && d.game) sel.value = d.game; } } catch (e) { }
  function save() { try { localStorage.setItem(KEY, JSON.stringify({ game: sel.value, kind: $("kind").value, body: $("body").value, when: $("when").value, who: $("who").value })); } catch (e) { } }
  ["game", "kind", "body", "when", "who"].forEach(function (k) { $(k).addEventListener("input", save); });
  function title() { var gn = sel.options[sel.selectedIndex].textContent; return "[反饋] " + gn + "｜" + $("kind").value; }
  function text() {
    return "遊戲：" + sel.options[sel.selectedIndex].textContent + "\n類型：" + $("kind").value + "\n時間地點：" + ($("when").value || "（未填）") + "\n署名／聯絡：" + ($("who").value || "（未填）") +
      "\n\n" + $("body").value.trim() + "\n\n—— 來自 NMNS30 到訪者反饋頁";
  }
  function say(t, bad) { $("status").textContent = t; $("status").style.color = bad ? "var(--bad)" : "var(--ok)"; }
  function ok() { if (!$("body").value.trim()) { say("請先寫下你記得的內容。", 1); $("body").focus(); return false; } return true; }
  $("copy").onclick = function () { if (!ok()) return; var t = text(); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { say("已複製，可貼到任何地方傳給我們。"); }, function () { $("preview").style.display = "block"; $("preview").textContent = t; say("無法自動複製，請手動選取下方內容。"); }); };
  $("dl").onclick = function () { if (!ok()) return; var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text()], { type: "text/plain;charset=utf-8" })); a.download = "nmns30-feedback.txt"; a.click(); say("已下載文字檔。"); };
  $("f").addEventListener("submit", function (e) {
    e.preventDefault(); if (!ok()) return; var t = text();
    if (C.FEEDBACK_REPO) { window.open("https://github.com/" + C.FEEDBACK_REPO + "/issues/new?title=" + encodeURIComponent(title()) + "&body=" + encodeURIComponent(t), "_blank", "noopener"); say("已開啟 GitHub 預填頁，請在該頁按「Submit new issue」完成送出。"); }
    else if (C.FEEDBACK_EMAIL) { location.href = "mailto:" + C.FEEDBACK_EMAIL + "?subject=" + encodeURIComponent(title()) + "&body=" + encodeURIComponent(t); say("已開啟你的郵件程式，請按寄出。"); }
    else { $("copy").click(); say("本站尚未設定收件處；內容已複製，請改用「複製內容」或「下載」後傳給站長。"); }
  });
  $("how").textContent = C.FEEDBACK_REPO ? "送出方式：會在 GitHub 專案開一則公開的 Issue（需 GitHub 帳號）。" : C.FEEDBACK_EMAIL ? "送出方式：會用你的郵件程式寄給站長。" : "目前站長尚未設定收件處，請用「複製內容」或「下載」保存留言。";
})();
</script>
</body>
</html>
