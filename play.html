<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NMNS30 遊戲</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header class="top"><div class="in">
  <h1><a href="index.html">NMNS30</a>｜<span id="gname">載入中</span></h1>
  <span class="sub" id="gen"></span>
</div></header>
<main>
  <div class="edu" id="edu"><b>教育內容（1991 年原文）</b><span id="eduText"></span></div>
  <div class="stage" id="stage"><noscript>需要啟用 JavaScript 才能遊玩。</noscript></div>
  <div class="nav">
    <a class="btn alt" id="prev" href="#">← 上一款</a>
    <a class="btn alt" href="index.html">遊戲選單</a>
    <button class="btn alt" type="button" id="again">重新開始</button>
    <a class="btn alt" id="next" href="#">下一款 →</a>
  </div>
</main>
<script src="data/games.js"></script>
<script src="shared/engine.js"></script>
<script>
(function () {
  var n = parseInt(new URLSearchParams(location.search).get("g"), 10);
  var g = NMNS_GAMES.filter(function (x) { return x.n === n; })[0];
  var stage = document.getElementById("stage");
  if (!g) { stage.textContent = "找不到這個遊戲，請回到選單。"; return; }
  var no = (n < 10 ? "0" : "") + n;
  document.title = g.name + "｜NMNS30";
  document.getElementById("gname").textContent = no + " " + g.name;
  document.getElementById("gen").textContent = g.en;
  document.getElementById("eduText").textContent = g.edu;
  document.querySelector(".edu").style.setProperty("--c", NMNS_CATS[g.cat].color);
  document.getElementById("prev").href = "play.html?g=" + (n > 1 ? n - 1 : 30);
  document.getElementById("next").href = "play.html?g=" + (n < 30 ? n + 1 : 1);
  document.getElementById("again").addEventListener("click", function () { location.reload(); });
  var s = document.createElement("script");
  s.src = "games/g" + no + ".js";
  s.onload = function () {
    try { NMNS.games[n](stage, g); }
    catch (e) { stage.textContent = "遊戲載入失敗：" + e.message; console.error(e); }
  };
  s.onerror = function () { stage.textContent = "這個遊戲的程式檔還沒準備好。"; };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
